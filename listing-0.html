<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1540 San Antonio St · Santa Clara, CA</title>
<link rel="icon" type="image/png" href="images/favicon-round.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFFFF;
    --ink: #1F2421;
    --clay: #D2693C;
    --sage: #7B8B7E;
    --tan: #F2F0EB;
    --line: rgba(31,36,33,0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; padding-top: 73px; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }

  nav { border-bottom: 1px solid var(--line); position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--paper); }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
  .brand .name { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; letter-spacing: 0.01em; }
  .nav-back { font-size: 13px; opacity: 0.6; }
  .nav-back:hover { opacity: 1; }

  section { padding: 64px 0; border-bottom: 1px solid var(--line); }
  .section-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sage); margin-bottom: 10px; }
  section h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: clamp(1.5rem, 3vw, 2rem); margin-bottom: 8px; }
  .section-sub { font-size: 14px; opacity: 0.55; margin-bottom: 28px; }

  .location-input-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .location-input-row input {
    flex: 1; padding: 13px 16px; border: 1px solid var(--line); border-radius: 10px;
    font-family: 'Inter', sans-serif; font-size: 15px; color: var(--ink); background: var(--tan);
    outline: none; transition: border-color 0.15s;
  }
  .location-input-row input:focus { border-color: var(--clay); background: #fff; }
  .location-input-row button {
    padding: 13px 22px; background: var(--clay); color: #fff; border: none; border-radius: 10px;
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;
    white-space: nowrap; transition: opacity 0.15s;
  }
  .location-input-row button:hover { opacity: 0.88; }

  .nearby-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 40px; }
  @media (max-width: 600px) { .nearby-grid { grid-template-columns: 1fr; } }
  .nearby-card { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .nearby-card-label { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
  .nearby-card-label .place { font-weight: 600; font-size: 14px; }
  .nearby-card-label .dist { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--clay); }
  .nearby-card iframe { width: 100%; height: 240px; border: 0; display: block; }

  .map-frame {
    width: 100%; height: 420px; border-radius: 16px; border: 1px solid var(--line);
    overflow: hidden; display: none;
  }
  .map-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .map-open-link { display: none; margin-top: 12px; font-size: 13px; color: var(--clay); font-weight: 500; }
  .map-open-link:hover { opacity: 0.8; }

  footer { padding: 32px 24px; display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em; opacity: 0.4; }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="/">
      <img class="logo" src="images/logo.webp" alt="Elaine Cai">
      <span class="name">Elaine Cai</span>
    </a>
    <a class="nav-back" href="/">← Back to listings</a>
  </div>
</nav>

<section>
  <div class="wrap">
    <div class="section-label">Location</div>
    <h2>Explore what's nearby</h2>
    <p class="section-sub">Enter any destination to see how far it is from 1540 San Antonio St, Menlo Park, CA 94025</p>

    <div class="location-input-row">
      <input type="text" id="fromAddr" placeholder="Enter your address, e.g. meta headquarters">
      <button onclick="showMap()">Explore</button>
    </div>

    <div class="nearby-grid">
      <div class="nearby-card">
        <div class="nearby-card-label">
          <span class="place">Stanford University</span>
          <span class="dist">~1.5 mi · 6 min</span>
        </div>
        <iframe src="https://maps.google.com/maps?saddr=1540+San+Antonio+St,+Menlo+Park,+CA&daddr=Stanford+University,+Stanford,+CA&output=embed" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <div class="nearby-card">
        <div class="nearby-card-label">
          <span class="place">Menlo Park Downtown</span>
          <span class="dist">~1.7 mi · 5 min</span>
        </div>
        <iframe src="https://maps.google.com/maps?saddr=1540+San+Antonio+St,+Menlo+Park,+CA&daddr=Downtown+Menlo+Park,+Menlo+Park,+CA&output=embed" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>

    <div class="map-frame" id="mapFrame">
      <iframe id="mapIframe" src="" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <a class="map-open-link" id="mapLink" target="_blank" rel="noopener">Open in Google Maps ↗</a>
  </div>
</section>

<footer>
  <span>Elaine Cai · Realtor® · Compass</span>
  <span>DRE# 02381708</span>
</footer>

<script>
  const DESTINATION = '1540 San Antonio St, Menlo Park, CA 94025';

  function showMap() {
    const from = document.getElementById('fromAddr').value.trim();
    if (!from) return;

    const encodedFrom = encodeURIComponent(from);
    const encodedTo = encodeURIComponent(DESTINATION);

    const embedSrc = `https://maps.google.com/maps?saddr=${encodedFrom}&daddr=${encodedTo}&output=embed`;
    const openUrl = `https://www.google.com/maps/dir/${encodedFrom}/${encodedTo}`;

    document.getElementById('mapIframe').src = embedSrc;
    document.getElementById('mapFrame').style.display = 'block';

    const link = document.getElementById('mapLink');
    link.href = openUrl;
    link.style.display = 'inline-block';
  }

  document.getElementById('fromAddr').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') showMap();
  });
</script>

</body>
</html>
